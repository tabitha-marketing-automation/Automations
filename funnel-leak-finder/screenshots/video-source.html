<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Tinos;font-style:italic;font-weight:700;src:url(fonts/tinos-latin-700-italic.woff2)}
@font-face{font-family:"DM Sans";font-weight:500;src:url(fonts/dm-sans-latin-500-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:700;src:url(fonts/dm-sans-latin-700-normal.woff2)}
:root{--rust:#A2341A;--bone:#E9E3DC;--cream:#F7F3EE;--ink:#2B0E07}
*{box-sizing:border-box}
body{margin:0;width:1080px;height:1350px;background:var(--bone);position:relative;overflow:hidden;font-family:"DM Sans",sans-serif;color:var(--ink)}
h1{position:absolute;left:44px;top:46px;margin:0;font:400 124px/0.95 Anton,sans-serif;color:var(--ink);text-transform:lowercase;width:900px}
h1 i{font:italic 700 124px/0.95 Tinos,serif;color:var(--rust);text-transform:none}
.burst{position:absolute;right:50px;top:200px}
.ex{position:absolute;left:46px;top:318px;font:700 20px/1 "DM Sans";letter-spacing:.12em;text-transform:uppercase;color:var(--rust)}
.bignum{font:400 84px/1 Anton,sans-serif;color:var(--ink)}
.bignum.r{color:var(--rust)}
.panel{position:absolute;width:480px;height:226px;background:var(--rust);border-radius:34px}
.head{position:absolute;left:22px;top:20px;display:flex;align-items:center;gap:12px}
.num{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bone);font:700 20px/38px "DM Sans";text-align:center}
.pill{background:var(--ink);color:var(--bone);font:700 25px/1 "DM Sans";padding:10px 22px;border-radius:999px;text-transform:none}
.inset{position:absolute;left:20px;right:20px;top:76px;bottom:20px;background:var(--cream);border-radius:22px;display:flex;align-items:center;gap:20px;padding:0 22px;border:3px solid transparent}
.tile{width:88px;height:88px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex:none;border:3px solid var(--ink)}
.tile svg{width:52px;height:52px}
.big{font:400 58px/1 Anton,sans-serif;text-transform:lowercase;color:var(--ink)}
.small{font:700 19px/1.2 "DM Sans";letter-spacing:.07em;text-transform:uppercase;color:var(--rust);margin-top:6px}
svg.lines{position:absolute;left:0;top:0}
#dot{position:absolute;width:36px;height:36px;border-radius:50%;background:var(--bone);border:5px solid var(--ink);margin:-18px 0 0 -18px;z-index:6}
.rule{position:absolute;left:44px;right:44px;top:1196px;height:3px;background:var(--ink)}
.cta{position:absolute;left:44px;top:1228px;background:var(--rust);color:var(--bone);font:700 26px/1 "DM Sans";padding:20px 34px;border-radius:999px}
.foot{position:absolute;right:44px;top:1246px;font:500 22px/1 "DM Sans";color:var(--ink);text-align:right}
.foot b{font-weight:700;letter-spacing:.08em}
</style>
<h1>how to find where leads <i>leak</i></h1><div class="ex">Example numbers · use your own</div>
<svg class="burst" width="96" height="96" viewBox="-50 -50 100 100" stroke="#A2341A" stroke-width="9" stroke-linecap="round"><g id="b"></g></svg>
<svg class="lines" width="1080" height="1350"><g id="edges" stroke="#2B0E07" stroke-width="9" stroke-linecap="round" opacity=".22"></g><g id="edgesOn" stroke="#2B0E07" stroke-width="9" stroke-linecap="round"></g></svg>
<div id="nodes"></div>
<div id="dot"></div>
<div class="rule"></div>
<div class="cta">Comment "LEAK"</div>
<div class="foot"><b>TABITHA WILLIAMS</b> &nbsp;|&nbsp; Marketing Automation Specialist</div>
<script>
const SVG={}, TILE={};
const b=document.getElementById('b');for(let i=0;i<12;i++){const a=i*30*Math.PI/180;const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',Math.cos(a)*14);l.setAttribute('y1',Math.sin(a)*14);l.setAttribute('x2',Math.cos(a)*44);l.setAttribute('y2',Math.sin(a)*44);b.appendChild(l)}
const N=[["Visitors",5000,"","","a month",0],["Leads",100,"","","2% of visitors",0],["Paid",1.5,"","","customers a month",1],["MRR today",225,"$","","new, every month",0],["Leaking",158,"$","","no reply, no follow-up",0,1],["Win back",39,"+$","","if you recover 25%",0]];
const L=40,R=560,W=480,H=226,Y=[372,634,896];
const pos=[[L,Y[0]],[R,Y[0]],[R,Y[1]],[L,Y[1]],[L,Y[2]],[R,Y[2]]];
const ctr=pos.map(p=>[p[0]+W/2,p[1]+H/2]);
const nodes=document.getElementById('nodes');
N.forEach((n,i)=>{const d=document.createElement('div');d.className='panel';d.id='n'+i;d.style.left=pos[i][0]+'px';d.style.top=pos[i][1]+'px';
 d.innerHTML='<div class="head"><div class="num">'+(i+1)+'</div><div class="pill">'+n[0]+'</div></div><div class="inset" id="i'+i+'"><div><div class="bignum'+(n[6]?' r':'')+'" id="v'+i+'">'+n[2]+'0</div><div class="small">'+n[4]+'</div></div></div>';nodes.appendChild(d)});
const segs=[];for(let i=0;i<5;i++)segs.push([ctr[i],ctr[i+1]]);
function line(g,a,b){const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);g.appendChild(l);return l}
const eg=document.getElementById('edges'),eo=document.getElementById('edgesOn');
segs.forEach(s=>line(eg,s[0],s[1]));const onL=segs.map(s=>line(eo,s[0],s[0]));
const SEG=1.25,START=0.9,T=START+SEG*5+2.6;
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
function setT(t){
  const p=(t-START)/SEG,pc=Math.max(0,Math.min(5,p)),si=Math.min(4,Math.floor(pc)),f=pc-si,a=segs[si][0],bb=segs[si][1],e=ease(f);
  const dot=document.getElementById('dot');dot.style.left=(a[0]+(bb[0]-a[0])*e)+'px';dot.style.top=(a[1]+(bb[1]-a[1])*e)+'px';
  dot.style.opacity=t<START-0.3?ease(t/(START-0.3)):(p>5?Math.max(0,1-(p-5)/0.4):1);
  segs.forEach((s,i)=>{const q=ease(Math.max(0,Math.min(1,p-i)));onL[i].setAttribute('x2',s[0][0]+(s[1][0]-s[0][0])*q);onL[i].setAttribute('y2',s[0][1]+(s[1][1]-s[0][1])*q)});
  for(let i=0;i<6;i++){const k=i==0?ease((t-0.2)/0.5):ease(p-i+0.3);const el=document.getElementById('n'+i);
    el.style.opacity=0.38+0.62*k;el.style.transform='scale('+(1+0.025*Math.sin(Math.min(k,1)*Math.PI))+')';
    document.getElementById('i'+i).style.borderColor=k>0.5?'#2B0E07':'transparent';
    const q=i==0?ease((t-0.3)/0.9):ease((p-i+0.15)/0.7);const v=N[i][1]*q;document.getElementById('v'+i).textContent=N[i][2]+(N[i][5]?v.toFixed(1):Math.round(v).toLocaleString('en-US'));}
  document.body.style.opacity=t>T-0.4?Math.max(0,(T-t)/0.4):1;
}
window.T=T;setT(0);
</script>
