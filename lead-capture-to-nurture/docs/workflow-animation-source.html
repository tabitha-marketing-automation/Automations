<!doctype html><meta charset="utf-8">
<style>
:root{--bg:#101614;--card:#17201d;--line:#2a3733;--ink:#e8efec;--mut:#9aa9a2;--acc:#6fb59e;--amb:#f0a35a}
*{box-sizing:border-box}
body{margin:0;width:1080px;height:1080px;background:var(--bg);color:var(--ink);font-family:"Inter","Liberation Sans","DejaVu Sans",Arial,sans-serif;position:relative;overflow:hidden}
.eyebrow{position:absolute;left:50px;top:52px;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700}
h1{position:absolute;left:50px;top:92px;width:980px;margin:0;font-size:66px;line-height:1.08;font-weight:800}
.sub{position:absolute;left:50px;top:268px;width:980px;font-size:28px;color:var(--mut);line-height:1.35}
.node{position:absolute;width:280px;height:160px;border:2px solid var(--line);border-radius:16px;background:var(--card);padding:18px 20px;transition:none}
.node b{display:block;font-size:26px;line-height:1.2}
.node span{display:block;margin-top:8px;font-size:19px;color:var(--mut);line-height:1.3}
.node .tool{display:block;margin:0 0 6px;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:600}
svg{position:absolute;left:0;top:0}
#dot{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--amb);box-shadow:0 0 24px 6px rgba(240,163,90,.6);margin:-13px 0 0 -13px}
.lead{position:absolute;left:50px;top:860px;width:980px;height:120px;border:2px solid var(--line);border-radius:16px;background:var(--card)}
.lead .who{position:absolute;left:24px;top:20px;font-size:24px;font-weight:700}
.lead .meta{position:absolute;left:24px;top:60px;font-size:20px;color:var(--mut)}
.chip{position:absolute;top:30px;padding:8px 18px;border-radius:999px;font-size:22px;font-weight:700;border:2px solid var(--line);color:var(--mut)}
#score{right:290px;width:210px;text-align:center}
#stage{right:150px;width:120px;text-align:center}
#mail{right:24px;width:106px;text-align:center}
.foot{position:absolute;left:50px;top:1020px;font-size:20px;color:var(--mut)}
.tag{position:absolute;font-size:17px;padding:4px 10px;border-radius:8px;background:rgba(111,181,158,.18);color:var(--acc);font-weight:600}
</style>
<div class="eyebrow">Free tools · no code</div>
<h1>What happens after a lead fills in your form</h1>
<div class="sub">Scored, staged, tagged and followed up automatically.</div>
<svg width="1080" height="1080"><g id="edges" stroke="#2a3733" stroke-width="4" fill="none" stroke-linecap="round"></g><g id="edgesOn" stroke="#6fb59e" stroke-width="4" fill="none" stroke-linecap="round"></g></svg>
<div id="nodes"></div>
<div id="dot"></div>
<div class="lead"><div class="who" style="width:480px">Alex Rivera, Head of Marketing</div><div class="meta">50-100 staff · Automation · Gmail</div>
<div class="chip" id="score">Score: 0</div><div class="chip" id="stage">Stage: ?</div><div class="chip" id="mail">Email</div></div>
<div class="foot">Built with HubSpot Free, Make, Google Sheets and Mailchimp</div>
<script>
const N=[
 ["Form","A lead submits your HubSpot form","HubSpot"],
 ["Contact created","Lands in the free CRM","HubSpot"],
 ["Scoring","Size, seniority, interest, email type","Make"],
 ["Stage","Lead, MQL or SQL","Make"],
 ["Tags","Stage and interest sent to the list","Mailchimp"],
 ["Nurture","Day 0, day 2 and day 5 emails","Mailchimp"]];
const X=[50,400,750], Y1=368, Y2=630, W=280,H=160;
const pos=[[X[0],Y1],[X[1],Y1],[X[2],Y1],[X[2],Y2],[X[1],Y2],[X[0],Y2]];
const ctr=pos.map(p=>[p[0]+W/2,p[1]+H/2]);
const nodes=document.getElementById('nodes');
N.forEach((n,i)=>{const d=document.createElement('div');d.className='node';d.id='n'+i;d.style.left=pos[i][0]+'px';d.style.top=pos[i][1]+'px';
 d.innerHTML=`<span class="tool">${n[2]}</span><b>${n[0]}</b><span>${n[1]}</span>`;nodes.appendChild(d)});
const tag=document.createElement('div');tag.className='tag';tag.id='tag';tag.style.left=(pos[4][0])+'px';tag.style.top=(pos[4][1]+H+8)+'px';tag.textContent='stage-mql · interest-automation';nodes.appendChild(tag);
// edges
const segs=[];for(let i=0;i<5;i++){segs.push([ctr[i],ctr[i+1]])}
function line(g,a,b,cls){const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);g.appendChild(l);return l}
const eg=document.getElementById('edges'),eo=document.getElementById('edgesOn');
segs.forEach(s=>line(eg,s[0],s[1]));
const onLines=segs.map(s=>line(eo,s[0],s[0]));
// timeline (seconds)
const SEG=1.15, START=0.9, T=START+SEG*5+2.6; // total loop
function ease(x){return x<0?0:x>1?1:x*x*(3-2*x)}
function setT(t){
  const p=(t-START)/SEG; // progress in segments
  const pc=Math.max(0,Math.min(5,p));
  const si=Math.min(4,Math.floor(pc)), f=pc-si;
  const a=segs[si][0],b=segs[si][1],e=ease(f);
  const dot=document.getElementById('dot');
  dot.style.left=(a[0]+(b[0]-a[0])*e)+'px';dot.style.top=(a[1]+(b[1]-a[1])*e)+'px';
  dot.style.opacity=t<START-0.3?ease((t)/(START-0.3)):(p>5?Math.max(0,1-(p-5)/0.4):1);
  segs.forEach((s,i)=>{const q=ease(Math.max(0,Math.min(1,p-i)));onLines[i].setAttribute('x2',s[0][0]+(s[1][0]-s[0][0])*q);onLines[i].setAttribute('y2',s[0][1]+(s[1][1]-s[0][1])*q)});
  // node active when reached
  for(let i=0;i<6;i++){const reached=p>=i-0.02||(i==0&&t>0.2);const el=document.getElementById('n'+i);
    const k=i==0?ease((t-0.2)/0.5):ease(p-i+0.3);
    el.style.borderColor=k>0?`rgba(111,181,158,${0.35+0.65*k})`:'#2a3733';
    el.style.boxShadow=k>0?`0 0 ${28*k}px rgba(111,181,158,${0.35*k})`:'none';}
  // lead card
  const sc=document.getElementById('score'),st=document.getElementById('stage'),ml=document.getElementById('mail');
  const sp=ease((p-1.9)/0.9); const score=Math.round(45*sp);
  sc.textContent='Score: '+score; sc.style.color=sp>0?'#e8efec':'#9aa9a2'; sc.style.borderColor=sp>0?'#6fb59e':'#2a3733';
  const stg=p>=3?1:0; st.textContent=stg?'MQL':'Stage: ?'; st.style.color=stg?'#101614':'#9aa9a2';st.style.background=stg?'#f0a35a':'transparent';st.style.borderColor=stg?'#f0a35a':'#2a3733';
  const tg=document.getElementById('tag');tg.style.opacity=ease((p-4)/0.5);
  // emails
  const eT=START+SEG*5; const em=t-eT;
  let txt='Email',col='#9aa9a2';
  if(em>0.2){txt='Day 0';col='#6fb59e'} if(em>1.0){txt='Day 2';} if(em>1.8){txt='Day 5';}
  ml.textContent=txt;ml.style.color=em>0.2?'#101614':'#9aa9a2';ml.style.background=em>0.2?'#6fb59e':'transparent';ml.style.borderColor=em>0.2?'#6fb59e':'#2a3733';
  // fade out end
  document.body.style.opacity=t>T-0.4?Math.max(0,(T-t)/0.4):1;
}
window.T=T;setT(0);
</script>
